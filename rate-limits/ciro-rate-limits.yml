note: >-
  Ciro documents no rate limits, because Ciro publishes no developer
  documentation and no public API at all. /docs, /api and /changelog all return
  404 on the marketing origin; docs.ciro.io, developer.ciro.io, developers.ciro.io
  and api.ciro.io are NXDOMAIN. The only non-marketing HTTP surface reachable
  without credentials is the product application at app.ciro.io, whose internal
  /api/graphql answers HTTP 401 Unauthorized to an anonymous request and carries
  no rate-limit headers of any kind — no X-RateLimit-*, no RateLimit-*, no
  Retry-After. Whether limits are enforced behind that login cannot be observed
  without a customer session, and nothing is asserted about it. An honest zero
  with the headers actually checked, rather than an omission.
