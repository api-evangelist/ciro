x-pointers-deliberately-absent:
- type: Blog
  was: https://www.ciro.io/blog
  reason: >-
    Removed 2026-08-14. The path now returns HTTP 301 to the homepage; Ciro has
    no blog. Verified against sitemap.xml, which lists no blog URL.
- type: SignUp
  was: https://app.ciro.io
  reason: >-
    Removed 2026-08-14. There is no self-serve signup — Ciro is sales-led and
    app.ciro.io offers only a login. The Login pointer carries the real surface.
- type: StatusPage
  was: https://status.ciro.io
  reason: >-
    Removed 2026-08-14. The host's TLS handshake fails ("tlsv1 alert internal
    error") on three consecutive probes, so the Better Stack status page cannot
    be loaded by any client. It served HTTP 200 on 2026-07-18. See
    lifecycle/ciro-lifecycle.yml; restore if the certificate is re-issued.
- type: WellKnown
  reason: >-
    Not emitted. Every /.well-known/ path 404s on ciro.io and returns an HTML SPA
    shell (not a document) on app.ciro.io. See well-known/ciro-well-known.yml.
- type: SDKs
  reason: >-
    Not emitted. Twelve registry lookups found no Ciro client library in any
    language. See packages/ciro-packages.yml.
- type: Webhooks
  reason: >-
    Not emitted. The integrations page names webhook export to Clay and Zapier in
    marketing copy, but no webhook catalog, event list, payload or subscription
    documentation is published anywhere, and zapier.com/apps/ciro returns 404.
- type: Pricing
  reason: Not emitted. /pricing returns 404 and no pricing page exists.
- type: AgentCard
  reason: >-
    Not emitted. Both /.well-known/agent-card.json and /.well-known/agent.json
    were probed on every host; ciro.io 404s and app.ciro.io returns the same HTML
    SPA shell it returns for every path. No card exists.
