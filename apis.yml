aid: ciro
name: Ciro
description: >-
  Ciro (Ciro Technologies Inc.) is an AI sales platform that finds a revenue
  team's best accounts, deeply qualifies each contact, runs a contact data
  waterfall for verified emails and phone numbers, and writes signal-based
  outbound that is pushed directly into existing sales tools. Reps command Ciro
  in plain English from Slack, where it runs prospect searches, enriches
  contacts, queries the CRM, analyzes CSVs, drafts multi-step personalized email
  sequences, and recommends the highest-ROI campaigns. It integrates with
  Salesforce and HubSpot (CRM); Salesloft, Outreach, Gong Engage, and Instantly
  (sales engagement); Slack; and webhook-based export to Clay and Zapier. Ciro is
  sold through a sales-led motion with no published pricing, is SOC 2 Type II
  certified, and was backed by Y Combinator and CRV. On 2026-07-08 Reevo
  announced it had acquired Ciro and is folding the prospecting agent into its
  revenue operating system; ciro.io remains live and still sells, and every page
  now carries an "acquired by Reevo" banner. Ciro was surfaced as a portfolio
  company of CRV and enriched into the API Evangelist network. It publishes no
  public developer API, no developer documentation, no OpenAPI, GraphQL, MCP or
  AsyncAPI contract, no SDK in any package registry, and no /.well-known/
  document — every one of those was probed on 2026-08-14 and missed.
